<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gitit-bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="40%" stop-color="#4F46E5" />
      <stop offset="75%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="hub-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- High-radius Squircle Background matching UI Logo -->
  <rect width="64" height="64" rx="16" fill="url(#gitit-bg)" />

  <!-- GITIT Gateway Hub Topology (Material Symbols Hub Fill=1) -->
  <g filter="url(#hub-glow)">
    <!-- Interconnecting Topology Traces -->
    <line x1="32" y1="32" x2="32" y2="16" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="32" y1="32" x2="18" y2="44" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />
    <line x1="32" y1="32" x2="46" y2="44" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" />

    <!-- Center Bridge Hub -->
    <circle cx="32" cy="32" r="7.5" fill="#FFFFFF" />
    <circle cx="32" cy="32" r="3" fill="#6366F1" />

    <!-- Top Upstream Node -->
    <circle cx="32" cy="16" r="5.5" fill="#FFFFFF" />
    <circle cx="32" cy="16" r="2.2" fill="#10B981" />

    <!-- Bottom Left Node -->
    <circle cx="18" cy="44" r="5.5" fill="#FFFFFF" />
    <circle cx="18" cy="44" r="2.2" fill="#4F46E5" />

    <!-- Bottom Right Node -->
    <circle cx="46" cy="44" r="5.5" fill="#FFFFFF" />
    <circle cx="46" cy="44" r="2.2" fill="#10B981" />
  </g>

  <!-- Live Pulse Corner Indicator -->
  <circle cx="53" cy="53" r="5.5" fill="#FFFFFF" />
  <circle cx="53" cy="53" r="3.8" fill="#10B981" />
</svg>